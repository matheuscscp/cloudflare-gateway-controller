name: ci-checks

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  # Post a pending commit status so that workflow_dispatch runs (used by the
  # upgrade workflows to trigger CI on bot-created PR branches) show up as a
  # check on the PR. Default GITHUB_TOKEN-created PRs do not auto-fire
  # workflows, so we dispatch manually and surface results via the statuses
  # API.
  ci-checks-pending:
    runs-on: ubuntu-latest
    steps:
      - name: Set pending status on PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api "repos/${{ github.repository }}/statuses/${{ github.sha }}" \
            -f state=pending \
            -f context="ci-checks" \
            -f description="CI checks running" \
            -f target_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

  tidy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Generate
        run: make tidy manifests

      - name: Verify no diff
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::Generated files are out of date. Run 'make tidy manifests' and commit the changes."
            git diff
            git status
            exit 1
          fi

  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Lint
        run: make lint

  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Test
        run: make test

  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Build
        run: make build

  # Gate job for branch protection rules. Always runs, but fails if any
  # check job did not succeed. Also posts a final commit status so
  # workflow_dispatch runs (from the upgrade workflows) surface as a PR check.
  ci-checks:
    if: always()
    needs: [ci-checks-pending, tidy, lint, test, build]
    runs-on: ubuntu-latest
    steps:
      - name: Update status on PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          results="${{ needs.tidy.result }} ${{ needs.lint.result }} ${{ needs.test.result }} ${{ needs.build.result }}"
          for result in $results; do
            if [ "$result" != "success" ] && [ "$result" != "skipped" ]; then
              gh api "repos/${{ github.repository }}/statuses/${{ github.sha }}" \
                -f state=failure \
                -f context="ci-checks" \
                -f description="CI checks failed" \
                -f target_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
              exit 1
            fi
          done
          gh api "repos/${{ github.repository }}/statuses/${{ github.sha }}" \
            -f state=success \
            -f context="ci-checks" \
            -f description="CI checks passed" \
            -f target_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
